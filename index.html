<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mtaani - AI.COM Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen p-4 flex justify-center">
<div class="w-full max-w-lg">

  <div class="text-center mt-6 mb-6">
    <div class="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-brain text-xl"></i></div>
    <h1 class="text-2xl font-bold">AI.COM Generator</h1>
    <p class="text-xs text-zinc-500 mt-1">Majina ya .com yenye ukaguzi wa ukweli (RDAP rasmi ya Verisign)</p>
  </div>

  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
    <input id="idea" placeholder="Andika biashara yako: kitchen, safari, mtaani..." class="w-full bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm outline-none focus:border-emerald-500">
    <input id="github" placeholder="GitHub URL (optional): github.com/user/repo" class="w-full mt-2 bg-black border border-zinc-800 rounded-xl px-4 py-3 text-sm outline-none focus:border-zinc-600">
    <button id="gen" class="w-full mt-4 bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-xl">Tengeneza na Check Majina 🧠</button>
    <label class="flex items-center gap-2 mt-3 text-xs text-zinc-400"><input id="onlyFree" type="checkbox" class="accent-emerald-500"> Onyesha yaliyo wazi tu</label>
  </div>

  <div id="summary" class="text-xs text-zinc-400 mt-3 text-center"></div>
  <div id="results" class="mt-3 space-y-2"></div>

  <p class="text-[10px] text-zinc-600 text-center mt-6">Powered by Mtaani AI • Real RDAP check • KES 130 hosting ready</p>
</div>

<script>
const PREFIXES = ['get','try','my','go','use','hey'];
const SUFFIXES = ['ly','hub','io','pro','spot','lab','base','ify'];

function clean(s){
  return (s||'').toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,' ').trim();
}

function generateNames(input, githubUrl){
  let source = input;
  if (!clean(source) && githubUrl) source = githubUrl.replace(/\/+$/,'').split('/').pop().replace(/[-_.]/g,' ');
  const words = clean(source).split(' ').filter(w => w.length > 1);
  if (!words.length) return [];
  const main = words[0];
  const joined = words.join('');
  const set = new Set([joined, main]);

  if (words.length > 1) {
    set.add(words.join('-'));
    set.add(words[0] + words[1]);
  }
  PREFIXES.forEach(p => set.add(p + joined));
  SUFFIXES.forEach(s => set.add(main + s));
  if (words.length > 1) set.add(joined + 'ke');
  set.add(main + 'ke');

  return Array.from(set)
    .map(n => n.replace(/[^a-z0-9-]/g,'').replace(/^-+|-+$/g,'').substring(0, 20))
    .filter(n => n.length >= 3)
    .slice(0, 14)
    .map(n => n + '.com');
}

// Rasmi: RDAP ya Verisign (registry ya .com). 404 = haijasajiliwa, 200 = imesajiliwa.
async function checkDomain(domain){
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    const r = await fetch('https://rdap.verisign.com/com/v1/domain/' + encodeURIComponent(domain), {
      headers: { 'Accept': 'application/rdap+json' }, signal: ctrl.signal
    });
    clearTimeout(t);
    if (r.status === 404) return { state: 'free' };
    if (r.status === 200) {
      let expires = null;
      try {
        const j = await r.json();
        const ev = (j.events || []).find(e => e.eventAction === 'expiration');
        if (ev) expires = ev.eventDate.slice(0, 10);
      } catch {}
      return { state: 'taken', expires };
    }
    throw new Error('status ' + r.status);
  } catch (e) {
    // Fallback: DNS (si uhakika 100%)
    try {
      const r = await fetch('https://dns.google/resolve?name=' + encodeURIComponent(domain) + '&type=NS');
      const j = await r.json();
      if (j.Status === 3) return { state: 'free', soft: true };
      return { state: 'taken' };
    } catch { return { state: 'unknown' }; }
  }
}

function row(domain){
  const div = document.createElement('div');
  div.dataset.domain = domain;
  div.className = 'bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex items-center justify-between';
  div.innerHTML = `
    <div>
      <div class="font-bold text-sm">${domain}</div>
      <div class="status text-[11px] text-zinc-500"><i class="fas fa-spinner fa-spin mr-1"></i>inakagua...</div>
    </div>
    <div class="flex gap-2">
      <button class="copyBtn bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-lg text-xs" aria-label="Copy"><i class="fas fa-copy"></i></button>
      <a class="buyBtn hidden bg-emerald-500 text-black px-3 py-1.5 rounded-lg text-xs font-bold" target="_blank" rel="noopener">Nunua</a>
    </div>`;
  const copyBtn = div.querySelector('.copyBtn');
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(domain);
    copyBtn.innerHTML = '<i class="fas fa-check"></i>';
    setTimeout(() => copyBtn.innerHTML = '<i class="fas fa-copy"></i>', 1200);
  };
  return div;
}

function applyResult(div, res){
  const status = div.querySelector('.status');
  const buy = div.querySelector('.buyBtn');
  const domain = div.dataset.domain;
  div.dataset.state = res.state;
  if (res.state === 'free') {
    status.innerHTML = res.soft
      ? '<span class="text-emerald-400">✅ Huenda iko wazi</span> <span class="text-zinc-500">(thibitisha unaponunua)</span>'
      : '<span class="text-emerald-400">✅ IPO WAZI - haijasajiliwa</span>';
    buy.href = 'https://www.namecheap.com/domains/registration/results/?domain=' + domain;
    buy.classList.remove('hidden');
    div.className = 'bg-emerald-950/30 border border-emerald-800 rounded-xl p-3 flex items-center justify-between';
  } else if (res.state === 'taken') {
    status.innerHTML = '<span class="text-red-400">❌ Imesajiliwa tayari</span>' + (res.expires ? ' <span class="text-zinc-500">• inaisha ' + res.expires + '</span>' : '');
    div.style.opacity = '0.5';
  } else {
    status.innerHTML = '<span class="text-zinc-400">⚠️ Imeshindwa kukagua - check manual</span>';
    buy.textContent = 'Check';
    buy.href = 'https://www.namecheap.com/domains/registration/results/?domain=' + domain;
    buy.classList.remove('hidden');
  }
  applyFilter();
}

function applyFilter(){
  const only = document.getElementById('onlyFree').checked;
  document.querySelectorAll('#results > div').forEach(d => {
    d.style.display = (only && d.dataset.state && d.dataset.state !== 'free') ? 'none' : '';
  });
}
document.getElementById('onlyFree').onchange = applyFilter;

document.getElementById('gen').onclick = async () => {
  const input = document.getElementById('idea').value;
  const gh = document.getElementById('github').value;
  if (!clean(input) && !gh.trim()) return alert('Andika biashara au GitHub URL');

  const names = generateNames(input, gh);
  const results = document.getElementById('results');
  const summary = document.getElementById('summary');
  results.innerHTML = '';
  if (!names.length) { summary.textContent = 'Tumia herufi za Kiingereza (a-z) kwenye jina.'; return; }

  const rows = names.map(n => { const d = row(n); results.appendChild(d); return d; });
  let free = 0, done = 0;
  summary.textContent = 'Inakagua ' + names.length + ' majina...';

  // Kagua 3 kwa wakati mmoja ili registry isikuzuie
  const queue = rows.slice();
  async function worker(){
    while (queue.length) {
      const div = queue.shift();
      const res = await checkDomain(div.dataset.domain);
      applyResult(div, res);
      done++; if (res.state === 'free') free++;
      summary.textContent = done < names.length
        ? 'Imekagua ' + done + '/' + names.length + ' • wazi: ' + free
        : 'Tayari ✅ Majina wazi: ' + free + ' kati ya ' + names.length;
    }
  }
  await Promise.all([worker(), worker(), worker()]);
};
</script>
</body>
</html>
